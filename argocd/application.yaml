apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ledger-api

spec:
  project: default

  source:
    repoURL: https://github.com/Omprakash458/Ledger-API.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
