name: Security and Delivery Pipeline

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

permissions:
contents: read
packages: write
id-token: write
security-events: write

jobs:
build-and-secure:
runs-on: ubuntu-latest

```
steps:
  # ----------------------------
  # Checkout
  # ----------------------------
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  # ----------------------------
  # Gate 1: Secrets Scanning
  # ----------------------------
  - name: Run Gitleaks
    uses: gitleaks/gitleaks-action@v2
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------
  # Gate 2: SAST (Semgrep)
  # ----------------------------
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.x'

  - name: Install Semgrep
    run: pip install semgrep

  - name: Run Semgrep Scan
    run: |
      semgrep scan \
        --config auto \
        --sarif \
        --output semgrep.sarif

  - name: Verify Semgrep SARIF
    if: always()
    run: |
      ls -lah
      test -f semgrep.sarif && echo 'Semgrep SARIF found'

  - name: Upload Semgrep SARIF Report
    uses: github/codeql-action/upload-sarif@v4
    if: always()
    with:
      sarif_file: semgrep.sarif

  # ----------------------------
  # Build Application
  # ----------------------------
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Build with Maven
    run: mvn clean package -DskipTests

  # ----------------------------
  # Docker Login
  # ----------------------------
  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------
  # Docker Metadata
  # ----------------------------
  - name: Extract Docker metadata
    id: meta
    uses: docker/metadata-action@v5
    with:
      images: ghcr.io/${{ github.repository }}

  # ----------------------------
  # Build Docker image locally
  # ----------------------------
  - name: Build Docker image (local)
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./Dockerfile
      load: true
      tags: ghcr.io/${{ github.repository }}:latest
      labels: ${{ steps.meta.outputs.labels }}

  # ----------------------------
  # Gate 3: Trivy Vulnerability Scan
  # ----------------------------
  - name: Run Trivy Vulnerability Scanner
    uses: aquasecurity/trivy-action@0.24.0
    with:
      image-ref: ghcr.io/${{ github.repository }}:latest
      format: sarif
      output: trivy-results.sarif
      severity: CRITICAL,HIGH
      exit-code: 0

  - name: Verify Trivy SARIF
    if: always()
    run: |
      ls -lah
      test -f trivy-results.sarif && echo 'Trivy SARIF found'

  - name: Upload Trivy SARIF Report
    uses: github/codeql-action/upload-sarif@v4
    if: always()
    with:
      sarif_file: trivy-results.sarif

  # Fail build if HIGH/CRITICAL vulnerabilities exist
  - name: Fail if HIGH/CRITICAL vulnerabilities found
    run: |
      if grep -q '"level":"error"' trivy-results.sarif; then
        echo 'High or Critical vulnerabilities detected'
        exit 1
      fi

  # ----------------------------
  # Push Docker image
  # ----------------------------
  - name: Push Docker image
    id: push
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./Dockerfile
      push: true
      tags: |
        ghcr.io/${{ github.repository }}:latest
      labels: ${{ steps.meta.outputs.labels }}

  # ----------------------------
  # Install Cosign
  # ----------------------------
  - name: Install Cosign
    uses: sigstore/cosign-installer@v3
    with:
      cosign-release: v2.2.4

  # ----------------------------
  # Sign Image
  # ----------------------------
  - name: Sign Docker image
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
      DIGEST: ${{ steps.push.outputs.digest }}
    run: |
      cosign sign --yes ${IMAGE}@${DIGEST}

  # ----------------------------
  # Generate SLSA Provenance Attestation
  # ----------------------------
  - name: Generate provenance predicate
    run: |
      cat <<EOF > predicate.json
      {
        "buildType": "https://github.com/Attestations/GitHubActionsWorkflow@v1",
        "builder": {
          "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        },
        "invocation": {
          "configSource": {
            "uri": "git+https://github.com/${{ github.repository }}.git",
            "digest": {
              "sha1": "${{ github.sha }}"
            }
          }
        },
        "metadata": {
          "buildInvocationID": "${{ github.run_id }}"
        }
      }
      EOF

  - name: Attest image provenance
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
      DIGEST: ${{ steps.push.outputs.digest }}
    run: |
      cosign attest --yes \
        --type slsaprovenance \
        --predicate predicate.json \
        ${IMAGE}@${DIGEST}
```
