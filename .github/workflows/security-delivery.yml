name: Security and Delivery Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write # Required for uploading SARIF results to Security tab

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- GATE 1: SECRETS SCANNING ---
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""

      # --- GATE 2: SAST ---
      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }} # Optional, keeps local scan working fine
          output: semgrep.sarif

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # Build image locally first so we can scan it BEFORE pushing
      - name: Build Docker image (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- GATE 3: CONTAINER VULNERABILITY SCAN ---
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.meta.outputs.tags }}'
          format: 'sarif'
          output: '${{ github.workspace }}/trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Hard-block build if CRITICAL or HIGH CVEs found

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: '${{ github.workspace }}/trivy-results.sarif'

      # --- PUSH IMAGE (Only runs if all security gates pass) ---
      - name: Push Docker image to GHCR
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          images="${TAGS}"
          for image in ${images}; do
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Generate and Sign Provenance Attestation
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          images="${TAGS}"
          for image in ${images}; do
            cosign attest --yes --type slsaprovenance --predicate ${{ github.workspace }}/.github/workflows/security-delivery.yml "${image}@${DIGEST}"
          done
