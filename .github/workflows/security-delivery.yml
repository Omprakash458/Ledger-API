name: Security and Delivery Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Gitleaks Secret Scan
      # --------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found. Skipping dependency installation."
          fi

      # --------------------------------------------------
      # Semgrep
      # --------------------------------------------------
      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep.sarif

      - name: Verify Semgrep Report
        if: always()
        run: |
          ls -la
          test -f semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # --------------------------------------------------
      # Docker Login
      # --------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Docker Metadata
      # --------------------------------------------------
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # --------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:latest

      # --------------------------------------------------
      # Trivy Scan
      # --------------------------------------------------
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Verify Trivy Report
        if: always()
        run: |
          ls -la
          test -f trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail if Critical or High Vulnerabilities Exist
        run: |
          if grep -q '"level":"error"' trivy-results.sarif; then
            echo "Critical or High vulnerabilities found."
            exit 1
          fi

      # --------------------------------------------------
      # Push Docker Image
      # --------------------------------------------------
      - name: Push Docker Image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      # --------------------------------------------------
      # Install Cosign
      # --------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.2.4

      # --------------------------------------------------
      # Sign Docker Image
      # --------------------------------------------------
      - name: Sign Docker Image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes ${IMAGE}@${DIGEST}

      # --------------------------------------------------
      # Create Provenance Predicate
      # --------------------------------------------------
      - name: Create Predicate
        run: |
          cat > predicate.json <<EOF
          {
            "buildType": "https://github.com/actions",
            "builder": {
              "id": "${{ github.server_url }}/${{ github.repository }}"
            },
            "metadata": {
              "buildInvocationID": "${{ github.run_id }}"
            }
          }
          EOF

      # --------------------------------------------------
      # Attest Image
      # --------------------------------------------------
      - name: Attest Image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest \
            --yes \
            --type slsaprovenance \
            --predicate predicate.json \
            ${IMAGE}@${DIGEST}
