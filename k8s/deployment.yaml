---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: ledger-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ledger-api

  template:
    metadata:
      labels:
        app: ledger-api

    spec:
      serviceAccountName: ledger-api-sa

      containers:
        - name: ledger-api
          image: ghcr.io/omprakash458/ledger-api:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-api-secret
                  key: API_KEY

          envFrom:
            - configMapRef:
                name: ledger-api-config

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
