---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: operator-role
  namespace: default

rules:
- apiGroups:
    - apps
  resources:
    - deployments
  verbs:
    - get
    - list
    - watch
    - update
    - patch

- apiGroups: [""]
  resources:
    - services
    - pods
  verbs:
    - get
    - list
